<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Проклятие фараона | Квест для стрима</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Playfair Display', serif;
      background: #0a0502;
      min-height: 100vh;
      overflow-x: hidden;
      color: #e6c04c;
    }
    /* Анимированный фон */
    .background {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #2c1a0a 0%, #0a0300 100%);
      z-index: -2;
    }
    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: transparent;
      z-index: -1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: #ffe28c;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
      box-shadow: 0 0 6px #ffd700;
    }
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.2); }
    }
    .pyramid-bg {
      position: fixed;
      bottom: 0; left: 10%;
      width: 300px; height: 200px;
      background: linear-gradient(135deg, #b8a05e 0%, #594a26 100%);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0.2;
      filter: blur(4px);
    }
    .sand {
      position: fixed;
      bottom: 0; left: 0; width: 100%; height: 120px;
      background: linear-gradient(transparent, #1c1204);
      opacity: 0.5;
      z-index: -1;
    }

    .game-container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 30px;
      background: rgba(12, 7, 3, 0.8);
      backdrop-filter: blur(20px);
      border: 2px solid #c29b2e;
      border-radius: 40px;
      box-shadow: 0 0 80px rgba(218, 165, 32, 0.4), inset 0 0 30px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      text-align: center;
      margin: 0 0 30px;
      background: linear-gradient(180deg, #f5d76e 0%, #b8860b 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px #b8860b, 0 0 10px #000;
      letter-spacing: 6px;
      filter: drop-shadow(0 4px 8px black);
    }

    .inventory-panel {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-bottom: 15px;
      align-items: center;
    }
    .artifact-icon {
      width: 55px; height: 55px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3b2e14, #1a1307);
      border: 3px solid #c29b2e;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      opacity: 0.4;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
    .artifact-icon.active {
      opacity: 1;
      box-shadow: 0 0 30px #f5d76e, 0 0 15px #b8860b;
      animation: artifactPulse 2s infinite;
    }
    @keyframes artifactPulse {
      0% { box-shadow: 0 0 20px #b8860b; }
      50% { box-shadow: 0 0 45px #ffd700, 0 0 20px #ff8c00; }
      100% { box-shadow: 0 0 20px #b8860b; }
    }
    .artifact-icon[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -45px;
      background: #000;
      color: #f5d76e;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      white-space: nowrap;
      z-index: 10;
      border: 1px solid gold;
    }

    .pyramid-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin-top: 30px;
    }
    .level-row {
      display: flex;
      gap: 35px;
      justify-content: center;
      width: 100%;
    }
    .room-card {
      width: 100px; height: 100px;
      background: #2b1e0c;
      border: 3px solid #8b6914;
      border-radius: 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 2.4rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23b8860b"><text x="0" y="22" font-size="24">☥</text></svg>');
      background-size: 50%;
      background-repeat: no-repeat;
      background-position: center;
      color: transparent;
      user-select: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }
    .room-card.locked {
      background: #0d0802;
      border-color: #4a3a1e;
      opacity: 0.6;
      cursor: not-allowed;
      background-image: none;
      color: #4a3a1e;
    }
    .room-card.completed {
      background: #1d4114;
      border-color: #d4af37;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><text x="0" y="22" font-size="24">✓</text></svg>');
      color: transparent;
    }
    .room-card.current {
      border-color: #ffd700;
      box-shadow: 0 0 40px #ffa500, 0 10px 25px black;
      animation: roomGlow 1.5s infinite alternate;
    }
    @keyframes roomGlow {
      from { box-shadow: 0 0 25px #ffa500; }
      to { box-shadow: 0 0 50px #ffd700, 0 0 70px #ff8c00; }
    }
    .room-label {
      position: absolute;
      bottom: -25px;
      font-size: 0.8rem;
      color: #c29b2e;
      white-space: nowrap;
      font-weight: bold;
      text-shadow: 0 0 8px black;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    .hidden { display: none; }
    @keyframes fadeIn { from{ opacity:0; } }

    .modal-window {
      background: linear-gradient(145deg, #1f1608, #0c0702);
      border: 3px solid #c29b2e;
      border-radius: 40px;
      padding: 30px;
      width: 95%;
      max-width: 650px;
      box-shadow: 0 0 80px #b8860b, inset 0 0 30px rgba(0,0,0,0.7);
      position: relative;
      animation: modalSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      color: #e6c04c;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes modalSlide {
      from { transform: scale(0.7) translateY(40px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .modal-window h2 {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 25px;
      text-shadow: 0 0 20px #daa520;
    }

    .puzzle-wrapper, .task-wrapper {
      margin: 15px 0;
    }
    .btn {
      background: linear-gradient(180deg, #f3cd4b, #b8860b);
      border: none;
      color: #0a0300;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-block;
      margin: 10px 8px;
      text-transform: uppercase;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.5);
    }
    .btn:hover {
      background: linear-gradient(180deg, #ffe484, #daa520);
      transform: translateY(-3px);
      box-shadow: 0 15px 25px black;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
    .timer-display {
      font-size: 2.5rem;
      font-family: monospace;
      text-align: center;
      margin: 15px 0;
      color: #ffa500;
      text-shadow: 0 0 20px red;
    }
    .task-card {
      background: #1b1105;
      padding: 20px;
      border-radius: 25px;
      border: 1px solid #8b6914;
      margin: 20px 0;
      font-size: 1.2rem;
      line-height: 1.6;
    }
    .reset-btn {
      position: absolute;
      top: 20px; right: 25px;
      background: transparent;
      border: 2px solid #8b6914;
      color: #c29b2e;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .reset-btn:hover { background: #8b6914; color: black; }

    /* Головоломка поиска */
    .find-grid {
      display: grid;
      grid-template-columns: repeat(5, 70px);
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }
    .find-cell {
      width: 70px; height: 70px;
      background: #2c1f0c;
      border: 2px solid #8b6914;
      border-radius: 15px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .find-cell:hover { background: #4d3a18; }
    .find-cell.found {
      opacity: 0.25;
      filter: grayscale(1);
      pointer-events: none;
    }

    /* Пятнашки */
    .sliding-grid {
      display: grid;
      gap: 8px;
      justify-content: center;
      margin: 20px auto;
    }
    .tile {
      width: 65px; height: 65px;
      background: radial-gradient(circle at 30% 30%, #c49b2e, #8b6914);
      border: 2px solid #f5d76e;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      color: #0a0300;
      box-shadow: 0 5px 10px black;
      transition: transform 0.15s;
    }
    .tile.empty { background: transparent; border: none; box-shadow: none; cursor: default; }

    .code-lock input {
      font-size: 2rem;
      width: 100px;
      text-align: center;
      background: #0d0702;
      border: 2px solid gold;
      color: gold;
      border-radius: 15px;
      margin: 10px;
      padding: 8px;
    }
  </style>
</head>
<body>
<div class="background"></div>
<div class="stars" id="stars"></div>
<div class="pyramid-bg"></div>
<div class="sand"></div>

<div class="game-container">
  <h1>Проклятие фараона</h1>
  <div class="inventory-panel" id="inventory">
    <div class="artifact-icon" id="art-amulet" data-tooltip="Амулет переброса">🪬</div>
    <div class="artifact-icon" id="art-scarab" data-tooltip="Скарабей удачи">🪲</div>
    <div class="artifact-icon" id="art-eye" data-tooltip="Глаз Ра (подсказка)">👁️</div>
  </div>
  <button class="reset-btn" onclick="resetGame()">Сброс</button>
  <div class="pyramid-layout" id="pyramid"></div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-window" id="modal-content"></div>
</div>

<script>
// ==================== СОСТОЯНИЕ ИГРЫ ====================
const STORAGE_KEY = 'pharaoh_quest_save';
let gameState = {
  completed: [],
  inventory: { amulet: 0, scarab: 0, eye: 0 },
  currentRoomId: null
};

// ==================== ДАННЫЕ КОМНАТ И ЗАДАНИЙ ====================
const rooms = [
  // Ярус 1: Пустыня и вход
  { id: 1, name: 'Первая ступень', level: 1, puzzle: 'find', puzzleData: { items: ['🪲','🪲','🪲','🪲','🪲'], gridSize: 5 },
    task: { slot: 'Book of Dead', desc: 'Сделай 15 вращений, получи хотя бы один расширяющийся символ', time: 300 } },
  { id: 2, name: 'Ловушка с песком', level: 1, puzzle: 'sliding', puzzleData: { size: 3 },
    task: { slot: 'Rise of Ra', desc: 'За 6 минут собери 3 скаттера и запусти бонусные вращения', time: 360 } },
  { id: 3, name: 'Страж порога', level: 1, puzzle: 'riddle',
    puzzleData: { question: 'Я высок, когда молод, и низок, когда стар. Что я?', answer: 'свеча' },
    task: { slot: 'Legacy of Egypt', desc: 'В бонусной игре набери выигрыш больше x15 от ставки', time: 420 } },
  // Ярус 2: Зал Кобр
  { id: 4, name: 'Шёпот кобр', level: 2, puzzle: 'find', puzzleData: { items: ['🐍','🐍','🐍','🐍','🐍'], gridSize: 5 },
    task: { slot: 'Eye of Horus', desc: 'Дождись, пока дикий символ расширится на весь барабан', time: 400 } },
  { id: 5, name: 'Ядовитый выбор', level: 2, puzzle: 'code', puzzleData: { equation: '𓀀=3, 𓁿=5, 𓂀=2. 𓀀 + 𓁿 * 𓂀 = ?', answer: 13 },
    task: { slot: 'Cleopatra', desc: 'Получи выигрышную линию из 5 символов фараона', time: 480 } },
  { id: 6, name: 'Алтарь кобр', level: 2, puzzle: 'door', puzzleData: { correct: 2 },
    task: { slot: 'Sphinx Wild', desc: 'Активируй функцию Sphinx Wild 3 раза за 8 минут', time: 480 } },
  // Ярус 3: Зал Скарабеев
  { id: 7, name: 'Полёт скарабея', level: 3, puzzle: 'sliding', puzzleData: { size: 3 },
    task: { slot: 'Book of Dead', desc: 'Получи 2 бонусные игры за 20 вращений', time: 360 } },
  { id: 8, name: 'Скарабей-хранитель', level: 3, puzzle: 'code', puzzleData: { equation: '𓂀 + 𓀀 = 10, 𓁿=6. 𓂀 * 𓁿 = ?', answer: 24 },
    task: { slot: 'Rise of Ra', desc: 'Выиграй x30 в бонусной игре', time: 420 } },
  { id: 9, name: 'Пыль времени', level: 3, puzzle: 'riddle',
    puzzleData: { question: 'У чего есть глаза, но нет зрения?', answer: 'игла' },
    task: { slot: 'Legacy of Egypt', desc: 'Активируй функцию Wheel of Gods и выиграй x20', time: 480 } },
  // Ярус 4: Святилище Бастет
  { id: 10, name: 'Глаза Бастет', level: 4, puzzle: 'find', puzzleData: { items: ['🐱','🐱','🐱','🐱','🐱'], gridSize: 5 },
    task: { slot: 'Cleopatra', desc: 'Собери 15 скаттеров за 10 минут', time: 600 } },
  { id: 11, name: 'Лунный свет', level: 4, puzzle: 'code', puzzleData: { equation: '𓀀=7, 𓁿=2, 𓂀=5. (𓀀 - 𓁿) * 𓂀 = ?', answer: 25 },
    task: { slot: 'Eye of Horus', desc: 'За 7 минут расширь дикий символ 2 раза', time: 420 } },
  { id: 12, name: 'Жертвенник', level: 4, puzzle: 'riddle',
    puzzleData: { question: 'Чем больше из неё берёшь, тем больше она становится. Что это?', answer: 'яма' },
    task: { slot: 'Sphinx Wild', desc: 'Получи джекпот в функции Sphinx Wild', time: 600 } },
  // Ярус 5: Тронный зал Фараона
  { id: 13, name: 'Тень фараона', level: 5, puzzle: 'door', puzzleData: { correct: 1 },
    task: { slot: 'Book of Dead', desc: 'Выиграй x100 в слоте Book of Dead за 10 минут', time: 600 } },
  { id: 14, name: 'Печать саркофага', level: 5, puzzle: 'sliding', puzzleData: { size: 4 },
    task: { slot: 'Legacy of Egypt', desc: 'Выиграй x50 в бонусной игре за 10 минут', time: 600 } },
  { id: 15, name: 'САРКОФАГ', level: 5, puzzle: null,
    task: { slot: 'Cleopatra', desc: 'ФИНАЛ: Удвой стартовый баланс ($7000 → $14000) за 15 минут!', time: 900 } }
];

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function loadGame() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    gameState = JSON.parse(saved);
  } else {
    gameState = { completed: [], inventory: { amulet: 0, scarab: 0, eye: 0 }, currentRoomId: null };
  }
}
function saveGame() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
}
function resetGame() {
  if (confirm('Точно сбросить весь прогресс?')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

// ==================== ОТРИСОВКА КАРТЫ ====================
function renderPyramid() {
  const container = document.getElementById('pyramid');
  container.innerHTML = '';
  const levels = [1,2,3,4,5];
  levels.forEach(lvl => {
    const levelRooms = rooms.filter(r => r.level === lvl);
    const divLevel = document.createElement('div');
    divLevel.className = 'level';
    levelRooms.forEach(room => {
      const divRoom = document.createElement('div');
      divRoom.className = 'room';
      if (gameState.completed.includes(room.id)) {
        divRoom.classList.add('completed');
        divRoom.textContent = '✓';
      } else if (isRoomUnlocked(room.id)) {
        divRoom.classList.add('current');
        divRoom.textContent = '☥';
      } else {
        divRoom.classList.add('locked');
        divRoom.textContent = '🔒';
      }
      divRoom.addEventListener('click', () => {
        if (isRoomUnlocked(room.id)) openRoom(room.id);
      });
      const label = document.createElement('span');
      label.textContent = room.name;
      divRoom.appendChild(label);
      divLevel.appendChild(divRoom);
    });
    container.appendChild(divLevel);
  });
}

function isRoomUnlocked(roomId) {
  const idx = rooms.findIndex(r => r.id === roomId);
  if (idx === 0) return true;
  const prevRoom = rooms[idx - 1];
  return gameState.completed.includes(prevRoom.id);
}

// ==================== ИНВЕНТАРЬ ====================
function updateInventoryDisplay() {
  document.getElementById('art-amulet').classList.toggle('active', gameState.inventory.amulet > 0);
  document.getElementById('art-scarab').classList.toggle('active', gameState.inventory.scarab > 0);
  document.getElementById('art-eye').classList.toggle('active', gameState.inventory.eye > 0);
}

// ==================== ОТКРЫТИЕ КОМНАТЫ ====================
let activePuzzleSolved = false;
let activeTaskTimer = null;

function openRoom(roomId) {
  gameState.currentRoomId = roomId;
  const room = rooms.find(r => r.id === roomId);
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  overlay.classList.remove('hidden');
  modal.innerHTML = `<h2>${room.name}</h2><div class="puzzle-wrapper" id="puzzle-container"></div><div class="task-wrapper hidden" id="task-container"></div>`;
  activePuzzleSolved = false;
  renderPuzzle(room);
  document.getElementById('modal-overlay').onclick = function(e) {
    if (e.target === overlay) closeModal();
  };
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  if (activeTaskTimer) clearInterval(activeTaskTimer);
  renderPyramid();
}

function completeRoom() {
  const roomId = gameState.currentRoomId;
  if (!gameState.completed.includes(roomId)) {
    gameState.completed.push(roomId);
    if (roomId === 3) gameState.inventory.amulet++;
    if (roomId === 6) gameState.inventory.scarab++;
    if (roomId === 9) gameState.inventory.eye++;
    if (roomId === 12) gameState.inventory.amulet++;
    saveGame();
  }
  updateInventoryDisplay();
  closeModal();
  renderPyramid();
}

// ==================== ГОЛОВОЛОМКИ ====================
function renderPuzzle(room) {
  const container = document.getElementById('puzzle-container');
  container.innerHTML = '';
  if (room.puzzle === 'find') {
    renderFindPuzzle(container, room.puzzleData);
  } else if (room.puzzle === 'code') {
    renderCodePuzzle(container, room.puzzleData);
  } else if (room.puzzle === 'sliding') {
    renderSlidingPuzzle(container, room.puzzleData);
  } else if (room.puzzle === 'riddle') {
    renderRiddlePuzzle(container, room.puzzleData);
  } else if (room.puzzle === 'door') {
    renderDoorPuzzle(container, room.puzzleData);
  } else if (room.puzzle === null) {
    activePuzzleSolved = true;
    showTask(room);
  }
}

function puzzleSolved(room) {
  activePuzzleSolved = true;
  showTask(room);
}

// Поиск предметов
function renderFindPuzzle(container, data) {
  const items = data.items;
  let found = 0;
  container.innerHTML = '<p style="text-align:center">Найди всех спрятанных существ!</p>';
  const grid = document.createElement('div');
  grid.className = 'find-objects';
  const allIcons = ['🐪','🏜️','☀️','⚱️','📜','🕋','🏺','🧿','🪨','🦂','🐫','🕷️'];
  const cells = [...items];
  while (cells.length < 20) cells.push(allIcons[Math.floor(Math.random()*allIcons.length)]);
  shuffleArray(cells);
  cells.forEach((icon, idx) => {
    const el = document.createElement('div');
    el.className = 'find-item';
    el.textContent = icon;
    el.dataset.idx = idx;
    if (items.includes(icon)) {
      el.dataset.target = 'true';
      el.addEventListener('click', function(e) {
        if (el.classList.contains('found')) return;
        el.classList.add('found');
        found++;
        if (found === items.length) {
          puzzleSolved(rooms.find(r => r.id === gameState.currentRoomId));
        }
      });
    }
    grid.appendChild(el);
  });
  container.appendChild(grid);
}

// Кодовый замок
function renderCodePuzzle(container, data) {
  container.innerHTML = `<p style="text-align:center; font-size:1.3rem;">${data.equation}</p>`;
  const inputDiv = document.createElement('div');
  inputDiv.className = 'code-input';
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'code-digit';
  input.style.width = '80px';
  inputDiv.appendChild(input);
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = 'Открыть';
  btn.onclick = () => {
    if (parseInt(input.value) === data.answer) {
      puzzleSolved(rooms.find(r => r.id === gameState.currentRoomId));
    } else {
      alert('Неверный код!');
    }
  };
  container.appendChild(inputDiv);
  container.appendChild(btn);
}

// Пятнашки
function renderSlidingPuzzle(container, data) {
  const size = data.size;
  const total = size * size;
  let tiles = Array.from({length: total-1}, (_,i) => i+1).concat(0);
  do { shuffleArray(tiles); } while (isSolved(tiles, size));
  let emptyIdx = tiles.indexOf(0);
  
  function draw() {
    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = `repeat(${size}, 60px)`;
    grid.style.gap = '5px';
    grid.style.justifyContent = 'center';
    tiles.forEach((val, idx) => {
      const cell = document.createElement('div');
      cell.style.width = '60px'; cell.style.height = '60px';
      cell.style.background = val === 0 ? 'transparent' : '#b8860b';
      cell.style.border = '2px solid gold';
      cell.style.borderRadius = '8px';
      cell.style.display = 'flex'; cell.style.alignItems = 'center'; cell.style.justifyContent = 'center';
      cell.style.fontSize = '1.5rem';
      cell.textContent = val === 0 ? '' : val;
      cell.addEventListener('click', () => moveTile(idx));
      grid.appendChild(cell);
    });
    container.appendChild(grid);
  }
  
  function moveTile(idx) {
    const row = Math.floor(idx / size), col = idx % size;
    const eRow = Math.floor(emptyIdx / size), eCol = emptyIdx % size;
    if ((Math.abs(row - eRow) + Math.abs(col - eCol)) === 1) {
      [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
      emptyIdx = idx;
      draw();
      if (isSolved(tiles, size)) {
        puzzleSolved(rooms.find(r => r.id === gameState.currentRoomId));
      }
    }
  }
  draw();
}

function isSolved(tiles, size) {
  return tiles.slice(0, -1).every((v,i) => v === i+1) && tiles[tiles.length-1] === 0;
}

// Загадка
function renderRiddlePuzzle(container, data) {
  container.innerHTML = `<p style="font-size:1.3rem; margin-bottom:15px;">${data.question}</p>`;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'code-digit';
  input.style.width = '200px';
  container.appendChild(input);
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = 'Ответить';
  btn.onclick = () => {
    if (input.value.trim().toLowerCase() === data.answer.toLowerCase()) {
      puzzleSolved(rooms.find(r => r.id === gameState.currentRoomId));
    } else {
      alert('Неверный ответ, подумай ещё.');
    }
  };
  container.appendChild(btn);
}

// Выбор двери
function renderDoorPuzzle(container, data) {
  container.innerHTML = '<p style="text-align:center">Выбери правильный проход:</p>';
  const doors = document.createElement('div');
  doors.style.display = 'flex'; doors.style.justifyContent = 'center'; doors.style.gap = '20px';
  for (let i = 1; i <= 3; i++) {
    const door = document.createElement('div');
    door.className = 'room';
    door.style.width = '80px'; door.style.height = '100px';
    door.textContent = i;
    door.onclick = () => {
      if (i === data.correct) {
        puzzleSolved(rooms.find(r => r.id === gameState.currentRoomId));
      } else {
        alert('Этот проход замурован, попробуй другой.');
      }
    };
    doors.appendChild(door);
  }
  container.appendChild(doors);
}

// ==================== ЗАДАНИЕ ДЛЯ КАЗИНО ====================
function showTask(room) {
  const taskContainer = document.getElementById('task-container');
  taskContainer.classList.remove('hidden');
  document.getElementById('puzzle-container').innerHTML = '<p style="text-align:center;color:gold;">✓ Пройдено</p>';
  
  const task = room.task;
  taskContainer.innerHTML = `
    <div class="task-card">
      <strong>🎰 Слот: ${task.slot}</strong><br>
      📋 ${task.desc}
    </div>
    <div class="timer-display" id="timer-display">${formatTime(task.time)}</div>
    <button class="btn" id="start-task-btn">Начать задание</button>
    <div id="task-buttons" class="hidden">
      <button class="btn" id="success-btn">✅ Успех</button>
      <button class="btn" id="fail-btn">❌ Провал</button>
    </div>
    <button class="btn hidden" id="use-amulet-btn">🪬 Исп. Амулет переброса</button>
  `;
  
  let timerInterval;
  const timerDisplay = document.getElementById('timer-display');
  const startBtn = document.getElementById('start-task-btn');
  const successBtn = document.getElementById('success-btn');
  const failBtn = document.getElementById('fail-btn');
  const taskButtons = document.getElementById('task-buttons');
  const useAmuletBtn = document.getElementById('use-amulet-btn');
  
  if (gameState.inventory.amulet > 0) {
    useAmuletBtn.classList.remove('hidden');
    useAmuletBtn.onclick = () => {
      gameState.inventory.amulet--;
      saveGame();
      updateInventoryDisplay();
      const altTasks = [
        { slot: 'Book of Dead', desc: 'Сделай 10 вращений с любым выигрышем', time: 180 },
        { slot: 'Rise of Ra', desc: 'Получи 1 бонусную игру', time: 240 },
      ];
      const newTask = altTasks[Math.floor(Math.random()*altTasks.length)];
      room.task = newTask;
      showTask(room);
    };
  }
  
  startBtn.onclick = () => {
    startBtn.disabled = true;
    let timeLeft = task.time;
    timerDisplay.textContent = formatTime(timeLeft);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = formatTime(timeLeft);
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerDisplay.textContent = '⏰ Время вышло!';
        startBtn.classList.add('hidden');
        taskButtons.classList.remove('hidden');
      }
    }, 1000);
    startBtn.textContent = 'Идёт задание...';
    taskButtons.classList.add('hidden');
  };
  
  successBtn.onclick = () => {
    if (timerInterval) clearInterval(timerInterval);
    completeRoom();
  };
  failBtn.onclick = () => {
    if (timerInterval) clearInterval(timerInterval);
    closeModal();
    renderPyramid();
  };
  
  activeTaskTimer = timerInterval;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

// ==================== ВСПОМОГАТЕЛЬНЫЕ ====================
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ==================== ГЕНЕРАЦИЯ ЗВЁЗД ====================
(function createStars() {
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    starsContainer.appendChild(star);
  }
})();

// ==================== ЗАПУСК ====================
loadGame();
updateInventoryDisplay();
renderPyramid();
</script>
