<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Проклятие фараона | Квест для стрима</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Playfair Display', serif;
      background: #0a0300;
      min-height: 100vh;
      overflow-x: hidden;
      color: #e6c04c;
      user-select: none;
    }
    /* Анимированный фон */
    .bg-stars {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: transparent; z-index:-2; pointer-events: none;
    }
    .bg-gradient {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: radial-gradient(ellipse at 50% 30%, #3b2512 0%, #0a0300 90%);
      z-index:-3;
    }
    .pyramid-silhouette {
      position: fixed; bottom:0; left:5%; width:400px; height:300px;
      background: linear-gradient(135deg, #b89e4e, #4d3a1a);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0.15; filter: blur(8px); z-index:-1;
    }
    .sand-layer {
      position: fixed; bottom:0; left:0; width:100%; height:140px;
      background: linear-gradient(transparent, #1e1308);
      opacity: 0.7; z-index:-1;
    }

    .game-wrapper {
      max-width: 1200px; margin: 20px auto; padding: 25px;
      background: rgba(10, 5, 2, 0.8); backdrop-filter: blur(25px);
      border: 2px solid #c29b2e; border-radius: 50px;
      box-shadow: 0 0 100px rgba(218,165,32,0.5), inset 0 0 40px rgba(0,0,0,0.7);
      position: relative; z-index:1;
    }
    h1 {
      font-family: 'Cinzel', serif; font-size: 4rem; text-align: center;
      margin: 0 0 30px; background: linear-gradient(180deg, #f9e076 0%, #b8860b 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px #b8860b, 0 0 10px black;
      letter-spacing: 8px; filter: drop-shadow(0 5px 10px black);
      animation: titleGlow 2s infinite alternate;
    }
    @keyframes titleGlow {
      from { text-shadow: 0 0 30px #b8860b, 0 0 10px black; }
      to { text-shadow: 0 0 60px #ffd700, 0 0 25px #ff8c00; }
    }

    .artifacts-bar {
      display: flex; justify-content: flex-end; gap: 20px; margin: 0 0 20px;
      align-items: center;
    }
    .artifact {
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4d3b1a, #1e1408);
      border: 3px solid #b8860b; display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; cursor: pointer; transition: 0.3s; position: relative;
      opacity: 0.3; box-shadow: 0 0 15px black;
    }
    .artifact.active {
      opacity: 1; box-shadow: 0 0 30px #ffd700, 0 0 15px #ff8c00;
      animation: artPulse 1.8s infinite;
    }
    @keyframes artPulse {
      0% { box-shadow: 0 0 20px #ffd700; }
      50% { box-shadow: 0 0 45px #ffa500, 0 0 25px #ff4500; }
      100% { box-shadow: 0 0 20px #ffd700; }
    }
    .artifact:hover::after {
      content: attr(data-tip); position: absolute; bottom: -45px;
      background: black; color: #f5d76e; padding: 6px 14px;
      border-radius: 25px; border: 1px solid gold; font-size: 0.85rem;
      white-space: nowrap; z-index:10;
    }

    .reset-button {
      position: absolute; top: 25px; right: 30px;
      background: transparent; border: 2px solid #8b6914; color: #c29b2e;
      padding: 8px 20px; border-radius: 25px; cursor: pointer; font-size: 0.9rem;
      transition: 0.3s; letter-spacing: 1px;
    }
    .reset-button:hover { background: #8b6914; color: black; }

    .pyramid-map {
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      margin-top: 25px;
    }
    .pyramid-level {
      display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;
    }
    .room-card {
      width: 110px; height: 110px; background: #2b1a08;
      border: 3px solid #8b6914; border-radius: 25px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 2.5rem; cursor: pointer; transition: all 0.3s ease; position: relative;
      background-size: 50%; background-repeat: no-repeat; background-position: center;
      color: transparent; box-shadow: 0 12px 20px rgba(0,0,0,0.7);
    }
    .room-card.locked {
      background: #0a0502; border-color: #4a3a1e; opacity: 0.6; cursor: not-allowed;
      background-image: none; color: #4a3a1e;
    }
    .room-card.completed {
      background: #144d16; border-color: #ffd700;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><text x="0" y="22" font-size="24">✓</text></svg>');
    }
    .room-card.current {
      border-color: #ffd700; box-shadow: 0 0 45px #ffa500, 0 10px 25px black;
      animation: roomGlow 1.2s infinite alternate;
    }
    @keyframes roomGlow {
      from { box-shadow: 0 0 25px #ffa500; }
      to { box-shadow: 0 0 55px #ffd700, 0 0 75px #ff8c00; }
    }
    .room-name {
      position: absolute; bottom: -28px; font-size: 0.8rem; color: #c29b2e;
      white-space: nowrap; font-weight: bold; text-shadow: 0 0 10px black;
      letter-spacing: 0.5px;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
      display: flex; align-items: center; justify-content: center;
      z-index:1000; animation: fadeIn 0.25s;
    }
    .hidden { display: none; }
    @keyframes fadeIn { from{opacity:0;} }

    .modal-panel {
      background: linear-gradient(160deg, #261a0a, #0c0600);
      border: 3px solid #c29b2e; border-radius: 45px; padding: 35px;
      width: 95%; max-width: 700px; box-shadow: 0 0 90px #b8860b, inset 0 0 35px rgba(0,0,0,0.8);
      animation: modalPop 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      color: #e6c04c; max-height: 85vh; overflow-y: auto;
    }
    @keyframes modalPop {
      from { transform: scale(0.75) translateY(30px); opacity:0; }
      to { transform: scale(1) translateY(0); opacity:1; }
    }
    .modal-panel h2 {
      font-family: 'Cinzel', serif; font-size: 2.6rem; text-align: center;
      margin-bottom: 25px; text-shadow: 0 0 20px #daa520;
    }

    .btn {
      background: linear-gradient(180deg, #f7d44a, #b8860b);
      border: none; color: #0a0300; font-weight: bold;
      padding: 14px 30px; border-radius: 40px; font-size: 1.2rem;
      cursor: pointer; transition: 0.3s; display: inline-block;
      margin: 10px 8px; text-transform: uppercase;
      font-family: 'Cinzel', serif; letter-spacing: 2px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.5);
    }
    .btn:hover { background: linear-gradient(180deg, #ffe484, #daa520); transform: translateY(-3px); }
    .btn:disabled { opacity:0.5; cursor:default; transform:none; }

    .timer-text {
      font-size: 2.8rem; font-family: monospace; text-align: center;
      margin: 15px 0; color: #ffa500; text-shadow: 0 0 25px red;
    }

    .task-card {
      background: #1b1105; padding: 22px; border-radius: 28px;
      border: 1px solid #8b6914; margin: 20px 0; font-size: 1.2rem; line-height: 1.7;
    }

    /* Головоломки */
    .find-grid {
      display: grid; grid-template-columns: repeat(5, 70px);
      gap: 12px; justify-content: center; margin: 20px 0;
    }
    .find-cell {
      width: 70px; height: 70px; background: #2c1f0c;
      border: 2px solid #8b6914; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; cursor: pointer; transition: 0.2s;
    }
    .find-cell:hover { background: #4d3a18; }
    .find-cell.found { opacity:0.2; filter:grayscale(1); pointer-events:none; }

    .sliding-grid {
      display: grid; gap: 8px; justify-content: center; margin: 20px auto;
    }
    .tile {
      width: 65px; height: 65px; background: radial-gradient(circle at 30% 30%, #c49b2e, #8b6914);
      border: 2px solid #f5d76e; border-radius: 15px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold; cursor: pointer; color: #0a0300;
      box-shadow: 0 5px 10px black; transition: transform 0.15s;
    }
    .tile.empty { background: transparent; border: none; box-shadow: none; cursor: default; }

    .code-input { font-size: 2rem; width: 100px; text-align: center; background: #0d0702; border: 2px solid gold; color: gold; border-radius: 15px; margin: 10px; padding: 8px; }

    .sequence-buttons { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
    .seq-btn { font-size: 2rem; padding: 12px; background: #2b1a08; border: 2px solid #c29b2e; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .seq-btn:active { background: #b8860b; }

    @media (max-width: 700px) {
      .room-card { width: 90px; height: 90px; }
    }
    /* Дополнительные стили для атмосферы */
    .particle {
      position: fixed; pointer-events: none; z-index: 999;
      animation: particleFade 1s ease-out forwards;
    }
    @keyframes particleFade {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(0); }
    }
  </style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="bg-stars" id="starsCanvas"></div>
<div class="pyramid-silhouette"></div>
<div class="sand-layer"></div>

<div class="game-wrapper">
  <h1>⚱️ Проклятие фараона</h1>
  <div class="artifacts-bar">
    <div class="artifact" id="art-amulet" data-tip="Амулет переброса (сменить задание)">🪬</div>
    <div class="artifact" id="art-scarab" data-tip="Скарабей удачи (упростить условие)">🪲</div>
    <div class="artifact" id="art-eye" data-tip="Глаз Ра (подсветка поиска)">👁️</div>
  </div>
  <button class="reset-button" onclick="resetProgress()">Сбросить прогресс</button>
  <div class="pyramid-map" id="mapContainer"></div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-panel" id="modalPanel"></div>
</div>

<script>
// ==================== ЗВУКОВЫЕ ЭФФЕКТЫ ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.value = 0.15;
  switch(type) {
    case 'click': osc.frequency.value = 800; osc.type = 'sine'; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); break;
    case 'success': osc.frequency.value = 1200; osc.type = 'triangle'; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); break;
    case 'fail': osc.frequency.value = 250; osc.type = 'sawtooth'; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
    case 'artifact': osc.frequency.value = 1500; osc.type = 'sine'; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); break;
  }
}

// ==================== ЧАСТИЦЫ ====================
function spawnParticles(x, y, count = 10) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.width = '6px';
    p.style.height = '6px';
    p.style.background = '#ffd700';
    p.style.borderRadius = '50%';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

// ==================== СОСТОЯНИЕ ====================
const STORAGE_KEY = 'pharaoh_quest_ultra';
let state = {
  completed: [],
  inventory: { amulet: 0, scarab: 0, eye: 0 },
  currentRoomId: null
};

// ==================== 30 КОМНАТ ====================
const rooms = [];
const levelNames = ['Пустыня и вход','Зал Кобр','Зал Скарабеев','Святилище Бастет','Тронный зал'];
for (let lvl = 1; lvl <= 5; lvl++) {
  for (let i = 1; i <= 6; i++) {
    const id = (lvl-1)*6 + i;
    let puzzle, puzzleData, task;
    if (lvl === 1) {
      if (i === 1) { puzzle = 'find'; puzzleData = { items: ['🪲','🪲','🪲','🪲','🪲'] }; task = { slot:'Book of Dead', desc:'Сделай 15 вращений, получи хотя бы один расширяющийся символ', time:300 }; }
      else if (i === 2) { puzzle = 'sliding'; puzzleData = { size:3 }; task = { slot:'Rise of Ra', desc:'За 5 минут собери 3 скаттера и запусти бонус', time:300 }; }
      else if (i === 3) { puzzle = 'riddle'; puzzleData = { q:'Я высок, когда молод, и низок, когда стар. Что я?', ans:'свеча' }; task = { slot:'Legacy of Egypt', desc:'В бонусной игре набери выигрыш > x15', time:360 }; }
      else if (i === 4) { puzzle = 'code'; puzzleData = { eq:'𓀀=2, 𓁿=3. 𓀀 + 𓁿 * 2 = ?', ans:8 }; task = { slot:'Eye of Horus', desc:'Дождись расширения дикого символа на весь барабан', time:360 }; }
      else if (i === 5) { puzzle = 'door'; puzzleData = { correct:1 }; task = { slot:'Cleopatra', desc:'Выигрышная линия из 4+ фараонов', time:420 }; }
      else if (i === 6) { puzzle = 'sequence'; puzzleData = { order:[2,1,3] }; task = { slot:'Sphinx Wild', desc:'Активируй Sphinx Wild 2 раза за 7 мин', time:420 }; }
    }
    else if (lvl === 2) {
      if (i === 1) { puzzle = 'find'; puzzleData = { items: ['🐍','🐍','🐍','🐍'] }; task = { slot:'Book of Dead', desc:'Получи бонусную игру', time:360 }; }
      else if (i === 2) { puzzle = 'riddle'; puzzleData = { q:'У чего есть глаза, но нет зрения?', ans:'игла' }; task = { slot:'Rise of Ra', desc:'Выигрыш x25 в бонусе', time:420 }; }
      else if (i === 3) { puzzle = 'code'; puzzleData = { eq:'𓂀=4, 𓀀=2. 𓂀 * 𓀀 + 3 = ?', ans:11 }; task = { slot:'Legacy of Egypt', desc:'Активируй Wheel of Gods и выиграй x20', time:480 }; }
      else if (i === 4) { puzzle = 'sliding'; puzzleData = { size:4 }; task = { slot:'Cleopatra', desc:'Собери 10 скаттеров за 8 мин', time:480 }; }
      else if (i === 5) { puzzle = 'door'; puzzleData = { correct:3 }; task = { slot:'Eye of Horus', desc:'Расширение дикого символа 3 раза', time:540 }; }
      else if (i === 6) { puzzle = 'sequence'; puzzleData = { order:[1,3,2] }; task = { slot:'Sphinx Wild', desc:'Получи джекпот в Sphinx Wild', time:600 }; }
    }
    else if (lvl === 3) {
      if (i === 1) { puzzle = 'find'; puzzleData = { items: ['🐱','🐱','🐱','🐱'] }; task = { slot:'Book of Dead', desc:'Выиграй x50 за 10 мин', time:600 }; }
      else if (i === 2) { puzzle = 'code'; puzzleData = { eq:'𓁿=5, 𓀀=3. (𓁿 - 𓀀) * 2 = ?', ans:4 }; task = { slot:'Rise of Ra', desc:'Запусти бонус и собери x30', time:480 }; }
      else if (i === 3) { puzzle = 'sliding'; puzzleData = { size:3 }; task = { slot:'Legacy of Egypt', desc:'Выиграй x15 в основной игре', time:420 }; }
      else if (i === 4) { puzzle = 'riddle'; puzzleData = { q:'Чем больше из неё берёшь, тем больше она становится. Что это?', ans:'яма' }; task = { slot:'Cleopatra', desc:'Получи 5 фараонов в линии', time:540 }; }
      else if (i === 5) { puzzle = 'door'; puzzleData = { correct:2 }; task = { slot:'Eye of Horus', desc:'Расширение дикого символа 2 раза', time:480 }; }
      else if (i === 6) { puzzle = 'sequence'; puzzleData = { order:[3,1,2] }; task = { slot:'Sphinx Wild', desc:'Активируй Sphinx Wild 3 раза', time:600 }; }
    }
    else if (lvl === 4) {
      if (i === 1) { puzzle = 'find'; puzzleData = { items: ['🦂','🦂','🦂'] }; task = { slot:'Book of Dead', desc:'Выиграй x75 в бонусной игре', time:600 }; }
      else if (i === 2) { puzzle = 'sliding'; puzzleData = { size:4 }; task = { slot:'Rise of Ra', desc:'Собери 4 скаттера за 8 мин', time:480 }; }
      else if (i === 3) { puzzle = 'code'; puzzleData = { eq:'𓂀 + 𓀀 = 12, 𓁿=5. 𓂀 * 2 = ?', ans:14 }; task = { slot:'Legacy of Egypt', desc:'Активируй Wheel of Gods дважды', time:600 }; }
      else if (i === 4) { puzzle = 'riddle'; puzzleData = { q:'Что можно разбить, даже не дотрагиваясь?', ans:'обещание' }; task = { slot:'Cleopatra', desc:'Выиграй x40 за 10 мин', time:600 }; }
      else if (i === 5) { puzzle = 'door'; puzzleData = { correct:1 }; task = { slot:'Eye of Horus', desc:'Расширение дикого символа 4 раза', time:600 }; }
      else if (i === 6) { puzzle = 'sequence'; puzzleData = { order:[2,3,1] }; task = { slot:'Sphinx Wild', desc:'Джекпот в Sphinx Wild за 15 мин', time:900 }; }
    }
    else if (lvl === 5) {
      if (i === 1) { puzzle = 'find'; puzzleData = { items: ['☥','☥','☥'] }; task = { slot:'Book of Dead', desc:'Выиграй x100 за 12 мин', time:720 }; }
      else if (i === 2) { puzzle = 'code'; puzzleData = { eq:'𓁿=8, 𓀀=2. (𓁿 - 𓀀) * 3 = ?', ans:18 }; task = { slot:'Rise of Ra', desc:'Запусти бонус 2 раза подряд', time:600 }; }
      else if (i === 3) { puzzle = 'sliding'; puzzleData = { size:5 }; task = { slot:'Legacy of Egypt', desc:'Выиграй x60 в бонусе', time:660 }; }
      else if (i === 4) { puzzle = 'riddle'; puzzleData = { q:'Я всегда иду, но никогда не двигаюсь. Что я?', ans:'часы' }; task = { slot:'Cleopatra', desc:'Собери 6 фараонов в линии', time:600 }; }
      else if (i === 5) { puzzle = 'door'; puzzleData = { correct:2 }; task = { slot:'Eye of Horus', desc:'Расширение дикого символа 5 раз', time:720 }; }
      else if (i === 6) { puzzle = null; puzzleData = null; task = { slot:'Cleopatra', desc:'ФИНАЛ: Удвой баланс ($7k→$14k) за 15 минут!', time:900 }; }
    }
    rooms.push({ id, name: `Комната ${id}`, level: lvl, puzzle, puzzleData, task });
  }
}

// ==================== ЗАГРУЗКА / СОХРАНЕНИЕ ====================
function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) state = JSON.parse(raw);
  else state = { completed: [], inventory: { amulet:0, scarab:0, eye:0 }, currentRoomId:null };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function resetProgress() {
  if (confirm('Сбросить весь прогресс?')) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
}

// ==================== ОТРИСОВКА КАРТЫ ====================
function renderMap() {
  const map = document.getElementById('mapContainer');
  map.innerHTML = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const levelRooms = rooms.filter(r => r.level === lvl);
    const row = document.createElement('div');
    row.className = 'pyramid-level';
    levelRooms.forEach(room => {
      const card = document.createElement('div');
      card.className = 'room-card';
      if (state.completed.includes(room.id)) {
        card.classList.add('completed');
        card.textContent = '✓';
      } else if (isUnlocked(room.id)) {
        card.classList.add('current');
        card.textContent = '☥';
        card.onclick = () => { initAudio(); playSound('click'); openRoom(room.id); };
      } else {
        card.classList.add('locked');
        card.textContent = '🔒';
      }
      const label = document.createElement('div');
      label.className = 'room-name';
      label.textContent = room.name;
      card.appendChild(label);
      row.appendChild(card);
    });
    map.appendChild(row);
  }
}

function isUnlocked(id) {
  const idx = rooms.findIndex(r => r.id === id);
  if (idx === 0) return true;
  return state.completed.includes(rooms[idx-1].id);
}

function updateArtifactsUI() {
  document.getElementById('art-amulet').classList.toggle('active', state.inventory.amulet > 0);
  document.getElementById('art-scarab').classList.toggle('active', state.inventory.scarab > 0);
  document.getElementById('art-eye').classList.toggle('active', state.inventory.eye > 0);
}

// ==================== МОДАЛЬНОЕ ОКНО ====================
let activeTaskTimer = null;
function openRoom(id) {
  state.currentRoomId = id;
  const room = rooms.find(r => r.id === id);
  const overlay = document.getElementById('modalOverlay');
  const panel = document.getElementById('modalPanel');
  overlay.classList.remove('hidden');
  panel.innerHTML = `<h2>${room.name}</h2><div id="puzzleArea"></div><div id="taskArea" class="hidden"></div>`;
  if (room.puzzle) renderPuzzle(room);
  else { showTask(room); }
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  if (activeTaskTimer) clearInterval(activeTaskTimer);
  renderMap();
}

function completeRoom() {
  const id = state.currentRoomId;
  if (!state.completed.includes(id)) {
    state.completed.push(id);
    if (id === 5 || id === 20) state.inventory.amulet++;
    if (id === 10 || id === 25) state.inventory.scarab++;
    if (id === 15 || id === 30) state.inventory.eye++;
    saveState();
    playSound('success');
    spawnParticles(window.innerWidth/2, window.innerHeight/2, 20);
  }
  updateArtifactsUI();
  closeModal();
}

// ==================== ГОЛОВОЛОМКИ ====================
function renderPuzzle(room) {
  const area = document.getElementById('puzzleArea');
  area.innerHTML = '';
  switch (room.puzzle) {
    case 'find': renderFind(area, room); break;
    case 'sliding': renderSliding(area, room); break;
    case 'code': renderCode(area, room); break;
    case 'riddle': renderRiddle(area, room); break;
    case 'door': renderDoor(area, room); break;
    case 'sequence': renderSequence(area, room); break;
  }
}

function puzzleDone(room) { playSound('success'); spawnParticles(event.clientX || 300, event.clientY || 300); showTask(room); }

// Поиск предметов
function renderFind(container, room) {
  const items = room.puzzleData.items;
  let foundCount = 0;
  container.innerHTML = '<p style="text-align:center;font-size:1.2rem;">Найди всех существ!</p>';
  const grid = document.createElement('div');
  grid.className = 'find-grid';
  const icons = ['🐪','🏜️','☀️','⚱️','📜','🕋','🧿','🦂','🐫','🕷️','🏺','🌟'];
  let cells = [...items];
  while (cells.length < 25) cells.push(icons[Math.floor(Math.random()*icons.length)]);
  shuffle(cells);
  cells.forEach(icon => {
    const cell = document.createElement('div');
    cell.className = 'find-cell';
    cell.textContent = icon;
    if (items.includes(icon)) {
      cell.dataset.target = '1';
      cell.onclick = () => {
        if (cell.classList.contains('found')) return;
        cell.classList.add('found');
        foundCount++;
        if (foundCount === items.length) puzzleDone(room);
      };
    }
    grid.appendChild(cell);
  });
  container.appendChild(grid);
}

// Пятнашки
function renderSliding(container, room) {
  const size = room.puzzleData.size;
  let tiles = [...Array(size*size-1).keys()].map(i => i+1).concat(0);
  do { shuffle(tiles); } while (isSolved(tiles));
  let emptyIdx = tiles.indexOf(0);
  function draw() {
    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'sliding-grid';
    grid.style.gridTemplateColumns = `repeat(${size}, 70px)`;
    tiles.forEach((val, idx) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (val===0?' empty':'');
      tile.textContent = val||'';
      tile.onclick = () => move(idx);
      grid.appendChild(tile);
    });
    container.appendChild(grid);
  }
  function move(idx) {
    const r1 = Math.floor(idx/size), c1 = idx%size;
    const r2 = Math.floor(emptyIdx/size), c2 = emptyIdx%size;
    if (Math.abs(r1-r2)+Math.abs(c1-c2) === 1) {
      [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
      emptyIdx = idx;
      draw();
      if (isSolved(tiles)) puzzleDone(room);
    }
  }
  draw();
}
function isSolved(tiles) {
  return tiles.slice(0,-1).every((v,i)=>v===i+1) && tiles[tiles.length-1]===0;
}

// Код
function renderCode(container, room) {
  container.innerHTML = `<p style="text-align:center;font-size:1.3rem;">${room.puzzleData.eq}</p>`;
  const div = document.createElement('div'); div.style.textAlign='center';
  const inp = document.createElement('input'); inp.type='number'; inp.className='code-input';
  const btn = document.createElement('button'); btn.className='btn'; btn.textContent='✓';
  btn.onclick = () => {
    if (parseInt(inp.value) === room.puzzleData.ans) { playSound('success'); puzzleDone(room); }
    else { playSound('fail'); alert('Неверно'); }
  };
  div.appendChild(inp); div.appendChild(btn);
  container.appendChild(div);
}

// Загадка
function renderRiddle(container, room) {
  container.innerHTML = `<p style="font-size:1.3rem;margin-bottom:15px;">${room.puzzleData.q}</p>`;
  const inp = document.createElement('input'); inp.type='text'; inp.className='code-input'; inp.style.width='200px';
  const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Ответ';
  btn.onclick = () => {
    if (inp.value.trim().toLowerCase() === room.puzzleData.ans.toLowerCase()) { playSound('success'); puzzleDone(room); }
    else { playSound('fail'); alert('Неправильно'); }
  };
  container.appendChild(inp); container.appendChild(btn);
}

// Дверь
function renderDoor(container, room) {
  container.innerHTML = '<p style="text-align:center;">Выбери правильный проход:</p>';
  const doorsDiv = document.createElement('div'); doorsDiv.style.display='flex'; doorsDiv.style.justifyContent='center'; doorsDiv.style.gap='20px';
  for (let i=1;i<=3;i++) {
    const door = document.createElement('div');
    door.className = 'room-card'; door.style.width='80px'; door.style.height='100px'; door.textContent = i;
    door.onclick = () => {
      if (i === room.puzzleData.correct) puzzleDone(room);
      else { playSound('fail'); alert('Замуровано!'); }
    };
    doorsDiv.appendChild(door);
  }
  container.appendChild(doorsDiv);
}

// Последовательность
function renderSequence(container, room) {
  const order = room.puzzleData.order;
  const symbols = ['𓀀','𓁿','𓂀'];
  let userSeq = [];
  container.innerHTML = '<p style="text-align:center;">Нажми символы в порядке: ' + order.map(i=>symbols[i-1]).join(' → ') + '</p>';
  const btnsDiv = document.createElement('div'); btnsDiv.className = 'sequence-buttons';
  symbols.forEach((sym, idx) => {
    const btn = document.createElement('div');
    btn.className = 'seq-btn'; btn.textContent = sym;
    btn.onclick = () => {
      userSeq.push(idx+1);
      if (userSeq.length === order.length) {
        if (userSeq.every((v,i)=>v===order[i])) puzzleDone(room);
        else { playSound('fail'); userSeq = []; alert('Неверная последовательность!'); }
      }
    };
    btnsDiv.appendChild(btn);
  });
  container.appendChild(btnsDiv);
}

// ==================== ЗАДАНИЕ ====================
function showTask(room) {
  document.getElementById('puzzleArea').innerHTML = '<p style="text-align:center;color:gold;">✓ Пройдено</p>';
  const taskArea = document.getElementById('taskArea');
  taskArea.classList.remove('hidden');
  const t = room.task;
  taskArea.innerHTML = `
    <div class="task-card"><strong>🎰 Слот: ${t.slot}</strong><br>📋 ${t.desc}</div>
    <div class="timer-text" id="timerDisplay">${formatTime(t.time)}</div>
    <button class="btn" id="startTaskBtn">▶ Начать задание</button>
    <div id="actionButtons" class="hidden" style="text-align:center;">
      <button class="btn" id="successBtn">✅ Успех</button>
      <button class="btn" id="failBtn">❌ Провал</button>
    </div>
    <button class="btn hidden" id="amuletBtn">🪬 Амулет</button>
  `;
  const timerEl = document.getElementById('timerDisplay');
  const startBtn = document.getElementById('startTaskBtn');
  const actionDiv = document.getElementById('actionButtons');
  const amuletBtn = document.getElementById('amuletBtn');
  let interval;

  if (state.inventory.amulet > 0) {
    amuletBtn.classList.remove('hidden');
    amuletBtn.onclick = () => {
      state.inventory.amulet--; saveState(); updateArtifactsUI(); playSound('artifact');
      const alt = { slot:'Book of Dead', desc:'Сделай 10 вращений с любым выигрышем', time:180 };
      room.task = alt; showTask(room);
    };
  }

  startBtn.onclick = () => {
    startBtn.disabled = true;
    let left = t.time;
    timerEl.textContent = formatTime(left);
    interval = setInterval(() => {
      left--;
      timerEl.textContent = formatTime(left);
      if (left <= 0) {
        clearInterval(interval);
        timerEl.textContent = '⏰ Время вышло!';
        startBtn.classList.add('hidden');
        actionDiv.classList.remove('hidden');
      }
    }, 1000);
    startBtn.textContent = 'Задание идёт...';
  };

  document.getElementById('successBtn').onclick = () => { if (interval) clearInterval(interval); completeRoom(); };
  document.getElementById('failBtn').onclick = () => { if (interval) clearInterval(interval); closeModal(); };
  activeTaskTimer = interval;
}

function formatTime(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s<10?'0':''}${s}`;
}

// ==================== ЗВЁЗДНЫЙ ФОН ====================
(function initStars() {
  const canvas = document.getElementById('starsCanvas');
  if (!canvas) return;
  canvas.style.position = 'fixed'; canvas.style.top=0; canvas.style.left=0;
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i=0;i<120;i++) {
      const x = (i*37)%canvas.width, y = (i*53)%canvas.height;
      ctx.fillStyle = `rgba(255,226,140,${0.5+Math.sin(Date.now()*0.002+i)*0.3})`;
      ctx.beginPath(); ctx.arc(x,y,Math.random()*2+0.5,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

// ==================== СТАРТ ====================
loadState();
updateArtifactsUI();
renderMap();
</script>
