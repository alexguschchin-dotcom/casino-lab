<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Охота на сокровища · Квест</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="container">
        <h1>🏴‍☠️ ОХОТА НА СОКРОВИЩА</h1>
        <div class="subtitle">20 испытаний · реальные деньги · твой счёт</div>

        <div class="top-bar">
            <div class="player-info">
                <label for="playerName">Участник:</label>
                <input type="text" id="playerName" placeholder="Введите имя" />
                <button id="applyNameBtn" class="btn-apply">Применить</button>
            </div>
            <div class="stats">
                <div class="stat-item">🎯 Выполнено: <span id="doneCount">0</span>/20</div>
                <div class="stat-item">⭐ Очки: <span id="totalScore">0</span></div>
                <button id="resetBtn" class="btn-reset">🔄 Сброс</button>
            </div>
        </div>

        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="grid" id="gridContainer"></div>

        <div class="footer">
            <div class="leaderboard">
                <h3>🏆 ТАБЛИЦА</h3>
                <table>
                    <thead>
                        <tr><th>#</th><th>Участник</th><th>Очки</th><th>Заданий</th></tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td>1</td><td id="lbName">—</td><td id="lbScore">0</td><td id="lbDone">0/20</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="bonus-box">
                <h3>🎁 СОКРОВИЩА</h3>
                <div class="bonus-value" id="bonusCount">0</div>
                <div style="font-size:0.85rem;color:#8892a0;margin-top:5px;">за каждые 5 заданий</div>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2 id="modalTitle">Задание #1</h2>
            <div class="task-desc" id="modalDesc">Описание задания</div>
            <div class="hint">Введите результат (множитель или сумму выигрыша в $):</div>
            <input type="number" id="resultInput" placeholder="Например: 87" step="any" />
            <div class="btn-group">
                <button class="btn-secondary" id="modalCloseBtn">Отмена</button>
                <button class="btn-primary" id="modalSaveBtn">✅ Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
